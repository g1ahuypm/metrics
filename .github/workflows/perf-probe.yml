# Temporary: measures how fast the live site answers (region, cold start, database round trip).
name: Speed probe

on:
  push:
    branches: [claude/stoic-dijkstra-rtla59]
    paths: [.github/workflows/perf-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Measure
        run: |
          U=https://metrics-azure.vercel.app
          fmt='%{http_code} connect=%{time_connect}s ttfb=%{time_starttransfer}s total=%{time_total}s\n'
          echo "== Region =="
          curl -sS -D - -o /dev/null "$U/api/health" | grep -i -E "x-vercel-id|server|age|x-vercel-cache"
          echo "== No database (401 answer), 8 calls =="
          for i in $(seq 8); do curl -sS -o /dev/null -w "$fmt" "$U/api/cron/tasks"; done
          echo "== One database query, 8 calls =="
          for i in $(seq 8); do curl -sS -o /dev/null -w "$fmt" "$U/api/health"; done
          echo "== Login page, 4 calls =="
          for i in $(seq 4); do curl -sS -o /dev/null -w "$fmt" "$U/login"; done
          echo "== After 6 minutes idle (database may go to sleep) =="
          sleep 360
          for i in $(seq 3); do curl -sS -o /dev/null -w "$fmt" "$U/api/health"; done
