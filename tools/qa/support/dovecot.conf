protocols = imap
listen = 127.0.0.1
base_dir = /var/tmp/dovecot-run
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:/var/tmp/mail/%u
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 1
log_path = /var/tmp/dovecot.log
passdb {
  driver = passwd-file
  args = scheme=PLAIN /var/tmp/dovecot-users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/tmp/mail/%u
}
service imap-login {
  inet_listener imap {
    port = 1143
  }
  inet_listener imaps {
    port = 0
  }
}
